<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" width="236" height="48" fill="none">
  <defs>
    <!-- Gradient for Shield Background -->
    <linearGradient id="hseShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradient for Leaf Accent -->
    <linearGradient id="hseLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="hseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g filter="url(#hseShadow)">
    <!-- Protective Shield Body -->
    <path d="M 23 4.5 
             C 32.5 4.5, 39.5 8.5, 40.5 16.5 
             C 41.5 28, 33 37.5, 23 43.5 
             C 13 37.5, 4.5 28, 5.5 16.5 
             C 6.5 8.5, 13.5 4.5, 23 4.5 Z" 
          fill="url(#hseShieldGrad)" 
          stroke="rgba(255, 255, 255, 0.4)" 
          stroke-width="1.2"/>

    <!-- Inner Shield Contour -->
    <path d="M 23 7.5
             C 30.5 7.5, 36.5 11, 37.5 17
             C 38.3 26.5, 31.5 34.5, 23 39.5
             C 14.5 34.5, 7.7 26.5, 8.5 17
             C 9.5 11, 15.5 7.5, 23 7.5 Z" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.22)" 
          stroke-width="0.8"/>

    <!-- White Safety Cross (Health & Safety) -->
    <!-- Vertical bar -->
    <rect x="20.5" y="14" width="5" height="16" rx="2" fill="#FFFFFF"/>
    <!-- Horizontal bar -->
    <rect x="15" y="19.5" width="16" height="5" rx="2" fill="#FFFFFF"/>

    <!-- Dynamic Environment Leaf (Symbolizing Sustainability / Environment) -->
    <path d="M 23 40.5 C 27.5 36.5, 37 30, 36.5 21 C 36 26.5, 30.5 34.5, 24.5 38.5 Z" 
          fill="url(#hseLeafGrad)" 
          opacity="0.95"/>
  </g>

  <!-- Title: HSE -->
  <text x="52" y="27" 
        font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="0.04em" 
        fill="#FFFFFF">
    HSE
  </text>

  <!-- Green Decorative Badge Dot -->
  <circle cx="105" cy="22.5" r="2.8" fill="#10B981"/>

  <!-- Subtitle: HEALTH, SAFETY & ENVIRONMENT -->
  <text x="52" y="39.5" 
        font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="0.07em" 
        fill="#38BDF8">
    HEALTH, SAFETY &amp; ENVIRONMENT
  </text>
</svg>
